description: >-
  Entity-relationship graph for the two Xiaoman/OKKI API surfaces. The OKKI CRM
  Open API publishes no components.schemas for most modules (the harvested
  fragments carry only four shared schemas), so entities and their identifiers
  are derived from the module path prefixes, the per-module fields/字段 data
  dictionary operations, and the id fields the message-push webhook payloads
  carry — those payload fields are the provider's own statement of each
  entity's primary key. Relationships marked inferred are read from document
  semantics (a sales order is raised for a customer) rather than from a $ref,
  because the specs do not model bodies.
apis:
  - name: Xiaoman (OKKI CRM) Open API
    base: https://api-sandbox.xiaoman.cn
    id_style: >-
      Numeric/string surrogate ids per module (<module>_id) plus a human-facing
      serial number (serial_id or <module>_no). Both are emitted on webhook
      events. No global prefixed-id scheme (no cus_/ord_ style prefixes).
    field_dictionary_pattern: >-
      Every module exposes GET /v1/<module>/fields returning its data dictionary,
      and several add /fields/selector for enumerated pickers — the machine
      -readable substitute for the absent components.schemas.
    entities:
      - name: company
        label: 客户 (customer / company)
        ids: [company_id, serial_id]
        operations: [GET /v1/company/list, GET /v1/company/info, GET /v1/company/query,
          POST /v1/company/pushCompanyAndCustomers, POST /v1/company/removeCompanyAndCustomers,
          POST /v1/company/moveToPublic, GET /v1/company/fields, GET /v1/company/companyEnums]
        note: Root customer entity; contacts are pushed together with the company.
      - name: customer_contact
        label: 联系人 (contact)
        ids: []
        operations: [POST /v1/company/push/customer, POST /v1/company/pushCompanyAndCustomers]
        note: >-
