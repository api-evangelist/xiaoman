  - name: OKKI Go API
    base: https://go.okki.ai
    id_style: >-
      Opaque hashed identifiers — companyHashId is the only company key and is
      only obtainable from POST /api/v1/companies/unlock. taskId and mailId key
      the outreach objects.
    entities:
      - name: company
        ids: [companyHashId]
        operations: [searchCompaniesAdvanced, unlockCompany, getCompanyProfile, getCompanyProfileEmails]
        note: >-
          Unlock is the gate — profile and profileEmails 404 without a
          companyHashId minted by unlockCompany.
      - name: contact_email
        operations: [getCompanyProfileEmails]
        note: Decision-maker emails, returned only for unlocked companies.
      - name: email_task
        ids: [taskId]
        operations: [sendBatchEmails, sendPersonalizedEmails, listEmailTasks, getEmailTask]
      - name: mail
        ids: [mailId]
        operations: [listEmailMails, getEmailMail]
      - name: credit_balance
        operations: [getCreditBalance]
        note: Search points and EDM quota; not a keyed resource.
    relationships:
      - {from: company, to: contact_email, kind: has_many, via: companyHashId, evidence: path-parameter}
      - {from: email_task, to: mail, kind: has_many, via: taskId, evidence: operation-semantics}
      - {from: email_task, to: contact_email, kind: has_many, via: recipient list, evidence: operation-semantics}
cross_surface:
  note: >-
    The two surfaces share no identifier space. An OKKI Go companyHashId cannot
    be used against the CRM, and a CRM company_id has no OKKI Go equivalent;
    bridging prospect to customer is a client-side match on domain or company
    name. No documented linking operation exists in either direction.
