aid: xiaoman
name: Xiaoman (OKKI)
description: >-
  Xiaoman Technology (小满科技, OKKI) is an AI-powered foreign-trade sales
  platform under Alibaba International Station, serving Chinese B2B exporters
  with the OKKI CRM, OKKI AiReach multi-channel customer acquisition, OKKI
  Shops site building, and OKKI Go, a B2B prospecting engine built for AI
  agents. The OKKI CRM Open API (open.xiaoman.cn) exposes 119 OAuth2
  module-scoped operations across customers, leads, opportunities, products,
  sales and purchase orders, quotations, payments, suppliers, inventory,
  users, and Pro-plan webhook message-push subscriptions. The OKKI Go API
  (go.okki.ai) provides company search, contact unlock, and cold-email
  outreach, shipped with a provider-published Agent Skill on npm
  (@okki-global/okki-go) that installs into Claude Code, Cursor, and other
  agent runtimes. Originally surfaced as a Qiming portfolio company.
