  /v1/invoices/purchaseReturn/push:
    post:
      summary: 采购退货单-新建/编辑
      deprecated: false
      description: '| 异常码 | 异常消息 |异常解决方案|

        | --- | --- | --- |

        | 404 | ‘xxx’ cannot be empty |  查看字段说明为“如果传入不能为空”，是否有字段传入了并且是空值|'
      tags:
      - s7.1
      parameters:
      - name: Authorization
        in: header
        description: 从/v1/oauth2/access_token获取到的access_token
        required: true
        example: '{{access_token}}'
        schema:
          type: string
          default: '{{access_token}}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                serial_id:
                  type: string
                  title: 采购退货单编号
                  description: 采购退货单编号
                currency:
                  type: string
                  title: 币种，参考传入值来自/v1/invoices/order/orderEnums返回值中currency_list的code
                exchange_rate:
                  type: number
                  title: 兑人民币汇率
                exchange_rate_usd:
                  type: number
                  title: 兑美元汇率
                warehouse_invoice_time:
                  type: string
                  title: 退货日期
                supplier_id:
                  type: integer
                  title: 供应商ID，可以从供应商接口中获取
                  description: 值来自/v1/supplier/list
                remark:
                  type: string
                  title: 退货备注
                record_list:
                  type: array
                  items:
                    type: object
                    properties:
                      return_price:
                        type: integer
                        title: 退货单价
                      return_count:
                        type: integer
                        title: 退货数量
                      product_id:
                        type: integer
                        title: 产品id
                        description: 值来自于/v1/product/list
                      sku_id:
                        type: integer
                        title: 产品sku_id
                        description: 值来自于/v1/product/list
                      inbound_record_id:
                        type: integer
                        title: 入库明细id
                      inbound_invoice_id:
                        type: integer
                        title: 入库单id
                        description: inbound_invoice_id和inbound_record_id要么都传，要么都不传
                    x-apifox-orders:
                    - return_price
                    - return_count
                    - product_id
                    - sku_id
                    - inbound_record_id
                    - inbound_invoice_id
                    required:
                    - return_price
                    - return_count
                    - product_id
                    - sku_id
                  title: 退货明细
                product_total_count:
                  type: integer
                  title: 产品总数量
                attachment:
                  type: array
                  items:
                    type: string
                  title: 附件，完整可以下载URL
                discount_rate:
                  type: integer
                  title: 整单折扣额
                handler:
                  type: array
                  items:
                    type: integer
                  title: 处理人ID
                  description: 值来自/v1/user/list
                invoice_warehouse_id:
                  type: integer
                  title: 仓库ID，可以从库存-仓库查询中获取
                  description: 值来自/v1/warehouse/list
                warehouse_return_invoice_id:
                  type: integer
                  title: 采购退货单id 编辑时需要传递
                  description: 值来自/v1/invoices/purchaseReturn/list
                user_id:
                  type: integer
                  title: 操作人
                  description: 值来自/v1/user/list
                status:
                  type: integer
                  title: 状态
                  description: 状态为1是草稿，2为已完成
              required:
              - currency
              - warehouse_invoice_time
              - supplier_id
              - remark
              - invoice_warehouse_id
              - product_total_count
              - attachment
              - discount_rate
              - handler
              - status
              x-apifox-orders:
              - serial_id
              - warehouse_return_invoice_id
              - user_id
              - currency
              - exchange_rate
              - exchange_rate_usd
              - warehouse_invoice_time
              - supplier_id
              - remark
              - invoice_warehouse_id
              - record_list
              - product_total_count
              - attachment
              - discount_rate
              - handler
              - status
            example:
              serial_id: ''
              currency: USD
              exchange_rate: '731.86'
              exchange_rate_usd: '100.00000'
              warehouse_invoice_time: '2025-01-09'
              supplier_id: 5137995577
              remark: 退货备注
              warehouse_id: 3485846285
              record_list:
              - return_price: 2
                return_count: 2
                product_id: 5158306884
                sku_id: 5158306885
                inbound_record_id: 5158307130
                inbound_invoice_id: 5158307129
              product_total_count: 2
              attachment: []
              discount_rate: 10
              handler:
              - 11858713
              status: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  now:
                    type: string
                  data:
                    type: object
                    properties:
                      warehouse_return_invoice_id:
                        type: integer
                      serial_id:
                        type: string
                    required:
                    - warehouse_return_invoice_id
                    - serial_id
                required:
                - code
                - message
                - now
                - data
              example:
