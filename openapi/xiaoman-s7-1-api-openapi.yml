                  type: string
                  title: 美元汇率
                account_date:
                  type: string
                  title: 结束日期
                stage:
                  type: integer
                  title: 销售阶段ID
                  description: 值来自于/v1/opportunity/fields/selector 接口
                currency:
                  type: string
                  title: 币种
                company_id:
                  type: integer
                  title: 客户ID
                  description: 新建时必填 值来自/v1/company/list 接口
                customer_id:
                  type: array
