description: >-
  Crosswalk binding Xiaoman/OKKI agent-facing tools to the REST operations that
  back them. Xiaoman ships NO MCP server (hosted or stdio) — its agent surface is
  a packaged Agent Skill distributed on npm whose executable scripts wrap the
  OKKI Go REST API. Each row therefore binds either an API Evangelist candidate
  MCP tool (mcp/xiaoman-mcp.yml) or a provider-shipped skill script to the
  OKKI Go operationId it calls. The 119-operation OKKI CRM Open API has no agent
  tooling at all and is recorded in rest_only[]. Confidence is high where the
  provider's own api-reference.md documents the script/endpoint pairing.
