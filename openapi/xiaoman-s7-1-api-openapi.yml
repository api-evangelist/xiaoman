  /v1/dynamic/trail/push:
    post:
      summary: 提交跟进动态
      deprecated: false
      description: '## 错误码解释

        | 异常码 | 异常消息 |异常解决方案|

        | --- | --- | --- |

        | -1 | 不支持的类型| remark_type传递有误，不在允许的范围内 |

        | -1 | 备注内容不能为空| content传递为空 |

        |-1 |lead_id and company_id and opportunity_id is empty|lead_id 与company_id 与 opportunity_id ，需要传递其中某一项|

        '
      tags:
      - s7.1
      parameters:
      - name: Authorization
        in: header
        description: 从/v1/oauth2/access_token获取到的access_token
        required: true
        example: '{{access_token}}'
        schema:
          type: string
          default: '{{access_token}}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                  x-apifox-mock: '1'
                  description: 客户ID
                lead_id:
                  type: integer
                  x-apifox-mock: '1'
                  description: 线索ID
                content:
                  type: string
                  x-apifox-mock: 内容
                  description: 动态内容
                remark_type:
                  type: integer
                  description: 跟进动态类型 默认101 101:快速记录 102:关联邮件备注 103:电话 104:会面 105:社交平台 106:总部拜访 107:办事处拜访 108:来访总部 109:来访办事处 110:邮件 111:客户拜访 112:日程跟进
                  x-apifox-mock: '101'
                opportunity_id:
                  type: integer
                  description: 商机ID
              x-apifox-orders:
              - company_id
              - lead_id
              - opportunity_id
              - content
              - remark_type
            example: "//新增客户写跟进\n{\n    \"company_id\": 5202566012,\n    \"lead_id\": \"\",\n    \"remark_type\":102,\n    \"content\": \"测试内容\"\n}\n\n//新增线索写跟进\n{\n    \"company_id\": \"\",\n    \"lead_id\": 52025660142,\n    \"remark_type\":103,\n    \"content\": \"测试内容\"\n}\n\n//新增商机写跟进\n{\n    \"opportunity_id\": 34545645767,\n    \"company_id\": \"\",\n    \"lead_id\": \"\",\n    \"remark_type\":104,\n    \"content\": \"测试内容\"\n}\n"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  now:
                    type: string
                  data:
                    type: object
                    properties:
                      trail_id:
                        type: integer
                        description: 动态ID
                    required:
                    - trail_id
                    x-apifox-orders:
                    - trail_id
                required:
                - code
                - message
                - now
                - data
                x-apifox-orders:
                - code
                - message
                - now
                - data
              example:
                code: 200
                message: success
                now: '2019-10-12 14:47:33'
                data:
                  trail_id: 1101090505
          headers: {}
          x-apifox-name: 成功
        x-200:请求成功:
          description: ''
          content:
            application/json:
              schema:
                title: ''
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                x-apifox-orders:
                - code
                - msg
              example:
                msg: success
                code: 0
          headers: {}
          x-apifox-name: 请求成功
      security: []
      x-apifox-folder: 客户
      x-apifox-status: released
