      x-apifox-folder: 采购退货单
      x-apifox-status: released
      x-run-in-apifox: https://open.xiaoman.cn/web/project/345096/apis/api-3484292-run
      externalDocs:
        url: https://open.xiaoman.cn/api-3484292
        description: Published operation doc (Apifox)
