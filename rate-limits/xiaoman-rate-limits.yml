specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Xiaoman
providerId: xiaoman
created: '2026-07-21'
modified: '2026-07-21'
generated: '2026-07-21'
method: searched
tags:
  - Rate Limiting
  - CRM
  - Prospecting
description: >-
  OKKI Go API (go.okki.ai) enforces a shared 60 requests/minute rate limit
  across all authenticated endpoints, returning RFC 7807 429 responses with
  type rate-limit (speed) or quota-exceeded (monthly/daily quota). Batch email
  endpoints additionally cap 100 recipients/emails per request. The OKKI CRM
  Open API (api-sandbox.xiaoman.cn) publishes no request rate limits, only
  60-second connect/response timeouts.
sources:
  - npm @okki-global/okki-go 1.3.4 skill/references/api-reference.md
  - https://open.xiaoman.cn/doc-338269
responseCodes:
  throttled: 429
limits:
  - name: OKKI Go authenticated requests
    scope: api-key
    metric: requests_per_minute
    limit: 60
    timeFrame: minute
  - name: OKKI Go batch email recipients per request
    scope: request
    metric: recipients_per_request
    limit: 100
    timeFrame: request
  - name: OKKI Go personalized emails per request
    scope: request
    metric: emails_per_request
    limit: 100
    timeFrame: request
